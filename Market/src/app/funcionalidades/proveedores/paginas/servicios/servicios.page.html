<ion-header>
  <ion-toolbar>
    <ion-title>Servicios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="servicios-content" fullscreen>
  <ion-list>
    <ion-item *ngFor="let servicio of (servicios$ | async)">
      <ion-label>
        <h2>{{ servicio.nombre }}</h2>
        <p>{{ servicio.descripcion }}</p>
        <ion-chip color="secondary">{{ servicio.categoria }}</ion-chip>
      </ion-label>
      <ion-toggle
        slot="end"
        [checked]="servicio.activo"
        (ionChange)="toggleServicio(servicio)">
      </ion-toggle>
      <ion-note slot="end" color="medium">
        {{ servicio.precio | currency:'MXN' }}
      </ion-note>
    </ion-item>
  </ion-list>
</ion-content>
