<ion-header>
  <ion-toolbar>
    <ion-title>Pedidos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="pedidos-content" fullscreen>
  <ion-list>
    <ion-item *ngFor="let pedido of (pedidos$ | async)">
      <ion-label>
        <h2>{{ pedido.cliente }} • {{ pedido.mascota }}</h2>
        <p>Servicio: {{ pedido.servicioId }} • {{ pedido.fecha | date:'dd/MM/yyyy HH:mm' }}</p>
      </ion-label>
      <ion-select
        interface="popover"
        [value]="pedido.estado"
        (ionChange)="actualizarEstado(pedido, $event.detail.value)">
        <ion-select-option *ngFor="let estado of estados" [value]="estado.valor">
          {{ estado.etiqueta }}
        </ion-select-option>
      </ion-select>
    </ion-item>
  </ion-list>
</ion-content>
